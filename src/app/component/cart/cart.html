<h1>Giỏ hàng</h1>
@for (item of productCartList(); track item.name) {
  @if (item.quantity > 0) {
    <p>Tên sản phẩm {{item.name}}</p>
    <p>Giá sản phẩm {{item.price}}</p>
    <p>Số lượng sản phẩm {{item.quantity}}</p>
    <button (click)="removeFromCart(item)">Xóa khỏi giỏ hàng</button>
    <br>
  }
}
<p>Tổng số tiền bạn cần phải thanh toán là : {{totalPrice()}}</p>
